<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECOS • Control de categorías</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --fondo-f5f5f5: #f5f5f5;
        --header-121212: #121212;
        --titulos-ffffff: #fff;
        --botones-d24242: #d24242;
        --base-rojo: #ff5050;
        --backgrounds-secondary: #f2f2f7;
        --texto-222222: #222;
        --subtexto-777777: #777;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        font-family: "Montserrat", -apple-system, Roboto, Helvetica, sans-serif;
      }

      body {
        background-color: var(--fondo-f5f5f5);
        color: var(--texto-222222);
      }

      /* Header */
      .header {
        width: 100%;
        height: 70px;
        background-color: var(--header-121212);
        display: flex;
        align-items: center;
        padding: 0 30px;
        box-sizing: border-box;
      }

      .header-content {
        display: flex;
        align-items: center;
        gap: 20px;
        flex: 1;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
      }

      .header-logo-container {
        display: flex;
        align-items: center;
        gap: 20px;
        min-width: fit-content;
      }

      .header-menu-icon {
        width: 25px;
        height: 20px;
        cursor: pointer;
      }

      .logo-text-gestion-cat {
        font-family: "Poppins", sans-serif;
        font-size: 50px;
        font-weight: 700;
        color: var(--titulos-ffffff);
        line-height: 1;
      }

      .logo-icon-gestion-cat {
        width: 75px;
        height: 75px;
        border-radius: 50%;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 30px;
        margin-left: auto;
      }

      .search-icon-gestion-cat,
      .user-icon {
        cursor: pointer;
        width: 25px;
        height: 25px;
      }

      .user-avatar-gestion-cat {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        cursor: pointer;
      }

      /* Main Container */
      .main-container {
        display: flex;
        width: 100%;
        min-height: calc(100vh - 70px);
      }

      /* Left Section */
      .left-section {
        flex: 0 0 auto;
        width: 50%;
        padding: 40px 51px;
        background-color: var(--fondo-f5f5f5);
        display: flex;
        flex-direction: column;
      }

      .back-button-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        cursor: pointer;
      }

      .back-arrow {
        width: 30px;
        height: 30px;
      }

      .page-title {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 40px;
      }

      .admin-icon {
        width: 56px;
        height: 56px;
      }

      .title-text {
        font-size: 32px;
        font-weight: 700;
        color: var(--texto-222222);
        line-height: 1.2;
      }

      .form-section {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 30px;
      }

      .form-button {
        align-self: flex-start;
        margin-top: 30px;
      }

      .form-label {
        font-size: 24px;
        font-weight: 400;
        color: var(--subtexto-777777);
        margin-bottom: 22px;
      }

      .form-input {
        width: 100%;
        height: 61px;
        padding: 0 15px;
        font-size: 24px;
        font-weight: 400;
        color: var(--subtexto-777777);
        border: 2px solid var(--subtexto-777777);
        border-radius: 6px;
        background-color: rgba(217, 217, 217, 0.01);
        font-family: "Montserrat", sans-serif;
        display: flex;
        align-items: center;
      }

      .form-input::placeholder {
        color: var(--subtexto-777777);
      }

      .form-input:focus {
        outline: none;
        border-color: var(--texto-222222);
      }

      /* Right Section */
      .right-section {
        flex: 0 0 auto;
        width: 50%;
        padding: 40px 51px;
        background-color: var(--fondo-f5f5f5);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      .request-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--texto-222222);
        margin-bottom: 30px;
      }

      .category-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
        flex: 1;
      }

      .category-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 0;
        height: 69px;
        border-bottom: 1px solid #eee;
      }

      .category-name {
        font-size: 18px;
        font-weight: 700;
        color: var(--texto-222222);
      }

      .checkbox {
        width: 24px;
        height: 24px;
        min-width: 24px;
        min-height: 24px;
        cursor: pointer;
        appearance: none;
        border: 2px solid #1d1b20;
        border-radius: 2px;
        background-color: transparent;
      }

      .checkbox:checked {
        background-color: var(--texto-222222);
      }

      /* Bottom Buttons */
      .button-container {
        display: flex;
        gap: 20px;
        justify-content: flex-end;
        padding: 40px;
        background-color: var(--fondo-f5f5f5);
        position: fixed;
        bottom: 0;
        right: 0;
        width: 50%;
      }

      .btn {
        width: 122px;
        height: 40px;
        font-size: 18px;
        font-weight: 600;
        border-radius: 67px;
        cursor: pointer;
        font-family: "Montserrat", sans-serif;
        border: none;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn-accept {
        background-color: var(--botones-d24242);
        color: var(--titulos-ffffff);
      }

      .btn-accept:hover {
        background-color: #c63636;
      }

      .btn-reject {
        background-color: var(--backgrounds-secondary);
        color: var(--botones-d24242);
        border: 1px solid var(--base-rojo);
      }

      .btn-reject:hover {
        background-color: #e8e8ed;
      }

      .btn-ban {
        background-color: var(--header-121212);
        color: var(--titulos-ffffff);
      }

      .btn-ban:hover {
        background-color: #2a2a2a;
      }

      /* Responsive Design */
      @media (max-width: 1024px) {
        .logo-text {
          font-size: 36px;
        }

        .logo-icon {
          width: 55px;
          height: 55px;
        }

        .left-section,
        .right-section {
          width: 100%;
          padding: 30px;
        }

        .main-container {
          flex-direction: column;
        }

        .title-text {
          font-size: 28px;
        }

        .form-label,
        .form-input {
          font-size: 18px;
        }

        .button-container {
          width: 100%;
          padding: 30px;
          bottom: auto;
          position: static;
        }
      }

      @media (max-width: 768px) {
        .header {
          padding: 0 15px;
        }

        .logo-text {
          font-size: 28px;
        }

        .logo-icon {
          width: 45px;
          height: 45px;
        }

        .header-right {
          gap: 15px;
        }

        .left-section,
        .right-section {
          width: 100%;
          padding: 20px;
        }

        .title-text {
          font-size: 24px;
        }

        .form-label {
          font-size: 18px;
        }

        .form-input {
          font-size: 16px;
          padding: 0 12px;
          height: 50px;
        }

        .category-name {
          font-size: 16px;
        }

        .btn {
          width: 110px;
          height: 36px;
          font-size: 16px;
        }

        .button-container {
          flex-wrap: wrap;
          gap: 15px;
        }
      }

      @media (max-width: 480px) {
        .header-logo-container {
          gap: 10px;
        }

        .logo-text {
          font-size: 20px;
        }

        .logo-icon {
          width: 35px;
          height: 35px;
        }

        .page-title {
          flex-direction: column;
          align-items: flex-start;
        }

        .admin-icon {
          width: 40px;
          height: 40px;
        }

        .title-text {
          font-size: 20px;
        }

        .request-title {
          font-size: 18px;
        }

        .form-label {
          font-size: 16px;
        }

        .form-input {
          font-size: 14px;
        }

        .category-item {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
          height: auto;
          padding: 12px 0;
        }

        .button-container {
          justify-content: center;
        }

        .btn {
          width: 100px;
          height: 32px;
          font-size: 14px;
        }
      }
    </style>
  </head>

  <body>
  

    <div class="main-container">
      <section class="left-section">
        <div class="back-button-container">
          <svg class="back-arrow" width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">

          </svg>
        </div>

        <div class="page-title">

        <div class="form-section">

      <section class="right-section">

            <input type="checkbox" class="checkbox" />
          </div>
          <div class="category-item">
            <span class="category-name">#México2026</span>
            <input type="checkbox" class="checkbox" />
          </div>
          <div class="category-item">
            <span class="category-name">#Copa2026</span>
            <input type="checkbox" class="checkbox" />
          </div>
        </div>
      </section>
    </div>

    <div class="button-container">
      <button class="btn btn-ban">Banear</button>
      <button class="btn btn-reject">Rechazar</button>
      <button class="btn btn-accept">Aceptar</button>
    </div>



    
  </body>
</html>
