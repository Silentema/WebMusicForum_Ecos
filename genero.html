    <script>
        function applyContrastFromStorage() {
            if (localStorage.getItem('contrastMode') === 'true') {
                document.body.classList.add('contrast-theme');
            } else {
                document.body.classList.remove('contrast-theme');
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            applyContrastFromStorage();
            var btn = document.getElementById('global-contrast-btn');
            if (btn) {
                btn.addEventListener('click', function() {
                    var isActive = document.body.classList.contains('contrast-theme');
                    localStorage.setItem('contrastMode', isActive ? 'false' : 'true');
                    applyContrastFromStorage();
                });
            }
            window.addEventListener('storage', function(e) {
                if (e.key === 'contrastMode') {
                    applyContrastFromStorage();
                }
            });
        });
    </script>

    const FOTO_RESPALDO = 'Image/cuenta.png';

    /* ---------- Utilidades ---------- */
    function urlProyecto(ruta) {
        return (typeof window.projectUrl === 'function') ? window.projectUrl(ruta) : ruta;
    }

    function fotoDeezer(nombre) {
        const clave = 'foto_' + nombre;
        const guardada = sessionStorage.getItem(clave);
        if (guardada) return Promise.resolve(guardada);
        return fetch(urlProyecto('PHP/deezer_generos.php?artista=' + encodeURIComponent(nombre)))
            .then(r => r.json())
            .then(res => {
                const foto = res.data && res.data[0] && res.data[0].picture_big;
                if (foto) sessionStorage.setItem(clave, foto);
                return foto || null;
            })
            .catch(() => null);
    }

    // Pone la foto local (o de respaldo) y la reemplaza por la de Deezer si existe
    function cargarFoto(img, busqueda, fotoLocal) {
        img.src = fotoLocal || FOTO_RESPALDO;
        img.onerror = function () { img.onerror = null; img.src = FOTO_RESPALDO; };
        fotoDeezer(busqueda).then(foto => { if (foto) img.src = foto; });
    }

    function el(tag, clase, texto) {
        const e = document.createElement(tag);
        if (clase) e.className = clase;
        if (texto !== undefined) e.textContent = texto;
        return e;
    }

    function renderInfo(lista) {
        const cont = document.getElementById('info-grid');
        lista.forEach(([etiqueta, valor]) => {
            const item = el('div', 'info-item');
            item.appendChild(el('span', 'info-label', etiqueta));
            item.appendChild(document.createTextNode(' '));
            item.appendChild(el('span', 'info-value', valor));
            cont.appendChild(item);
        });
    }

    function renderStats(idContenedor, lista) {
        const cont = document.getElementById(idContenedor);
        lista.forEach(([numero, etiqueta]) => {
            const item = el('div', 'stat-item');
            item.appendChild(el('div', 'stat-number', numero));
            item.appendChild(el('div', 'stat-label', etiqueta));
            cont.appendChild(item);
        });
    }

    function renderLeyendas(lista) {
        const cont = document.getElementById('leyendas-grid');
        lista.forEach(([nombre, busqueda, numero, etiqueta, rol, fotoLocal]) => {
            const card = el('div', 'mvp-card');
            const img = el('img', 'mvp-player-image');
            img.alt = nombre;
            cargarFoto(img, busqueda, fotoLocal);
            card.appendChild(img);

            const stats = el('div', 'mvp-stats');
            stats.appendChild(el('div', 'mvp-number', numero));
            stats.appendChild(el('div', 'mvp-label', etiqueta));
            card.appendChild(stats);

            card.appendChild(el('div', 'mvp-player-name', nombre));
            card.appendChild(el('div', 'mvp-player-position', rol));
            cont.appendChild(card);
        });
    }

    function ladoDueto(datos, imagenPrimero) {
        const [nombre, busqueda, fotoLocal] = datos;
        const lado = el('div', 'match-teams');
        const img = el('img', 'team-logo');
        img.alt = nombre;
        cargarFoto(img, busqueda, fotoLocal);
        const span = el('span', 'team-name', nombre);
        if (imagenPrimero) { lado.appendChild(img); lado.appendChild(span); }
        else { lado.appendChild(span); lado.appendChild(img); }
        return lado;
    }

    function renderDuetos(lista) {
        const cont = document.getElementById('duetos-grid');
        lista.forEach(d => {
            const card = el('div', 'match-card');

            const fase = el('div', 'match-phase');
            d.fase.split('<br>').forEach((linea, i) => {
                if (i > 0) fase.appendChild(document.createElement('br'));
                fase.appendChild(document.createTextNode(linea));
            });
            card.appendChild(fase);
            card.appendChild(el('div', 'match-date', 'Lanzamiento: ' + d.anio));

            const fila = el('div', 'match-container');
            fila.appendChild(ladoDueto(d.a, true));
            fila.appendChild(el('div', 'match-score', d.cancion));
            fila.appendChild(ladoDueto(d.b, false));
            card.appendChild(fila);

            card.appendChild(el('div', 'match-line'));
            cont.appendChild(card);
        });
    }

    function renderArtistas(lista) {
        const cont = document.getElementById('artistas-grid');
        lista.forEach(([nombre, descripcion, fotoLocal]) => {
            const card = el('div', 'player-card');
            const img = el('img', 'player-image');
            img.alt = nombre;
            cargarFoto(img, nombre, fotoLocal);
            card.appendChild(img);
            card.appendChild(el('div', 'player-name', nombre));
            card.appendChild(el('div', 'player-position', descripcion));
            cont.appendChild(card);
        });
    }

    /* ---------- Videos de YouTube ---------- */
    function buscarVideo(consulta) {
        const clave = 'yt_' + consulta;
        const guardado = sessionStorage.getItem(clave);
        if (guardado) {
            try { return Promise.resolve(JSON.parse(guardado)); } catch (e) {}
        }
        return fetch(urlProyecto('PHP/youtube_buscar.php?q=' + encodeURIComponent(consulta)))
            .then(r => r.json())
            .then(d => {
                if (!d || !d.id) return null;
                sessionStorage.setItem(clave, JSON.stringify(d));
                return d;
            })
            .catch(() => null);
    }

    function crearTarjetaVideo(video, nombreArtista) {
        const card = el('div', 'video-card');
        const marco = el('div', 'video-frame');

        const miniatura = document.createElement('button');
        miniatura.type = 'button';
        miniatura.className = 'video-thumb';
        miniatura.setAttribute('aria-label', 'Reproducir video de ' + nombreArtista);
        miniatura.style.backgroundImage = 'url(https://i.ytimg.com/vi/' + encodeURIComponent(video.id) + '/hqdefault.jpg)';
        miniatura.innerHTML = '<svg viewBox="0 0 68 48" aria-hidden="true">' +
            '<path d="M66.5 7.7a8.5 8.5 0 0 0-6-6C55.2 0 34 0 34 0S12.8 0 7.5 1.7a8.5 8.5 0 0 0-6 6C0 13 0 24 0 24s0 11 1.5 16.3a8.5 8.5 0 0 0 6 6C12.8 48 34 48 34 48s21.2 0 26.5-1.7a8.5 8.5 0 0 0 6-6C68 35 68 24 68 24s0-11-1.5-16.3z" fill="#f00"/>' +
            '<path d="M45 24 27 14v20z" fill="#fff"/></svg>';

        // El video solo se carga al hacer clic (más rápido y sin rastreo hasta reproducir)
        miniatura.addEventListener('click', function () {
            const iframe = document.createElement('iframe');
            iframe.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(video.id) + '?autoplay=1&rel=0';
            iframe.title = video.titulo || nombreArtista;
            iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
            iframe.allowFullscreen = true;
            marco.replaceChildren(iframe);
        });

        marco.appendChild(miniatura);
        card.appendChild(marco);
        card.appendChild(el('div', 'video-titulo', video.titulo || nombreArtista));
        card.appendChild(el('div', 'video-canal', video.canal || ''));
        return card;
    }

    function renderVideos(leyendas) {
        const seccion = document.getElementById('videos-seccion');
        const grid = document.getElementById('videos-grid');
        leyendas.slice(0, 3).forEach(([nombre, busqueda]) => {
            buscarVideo(busqueda + ' official music video').then(video => {
                if (!video) return;
                grid.appendChild(crearTarjetaVideo(video, nombre));
                seccion.style.display = '';
            });
        });
    }

    /* ---------- Inicio ---------- */
    document.addEventListener('DOMContentLoaded', function () {
        const g = new URLSearchParams(location.search).get('g');
        const clave = Object.prototype.hasOwnProperty.call(GENEROS, g) ? g : 'Country';
        const genero = GENEROS[clave];

        document.title = 'ECOS • Género ' + genero.titulo;
        document.getElementById('genero-titulo').textContent = genero.titulo;

        const icono = document.getElementById('genero-icono');
        icono.alt = 'Icono de ' + genero.titulo;
        icono.onerror = function () { icono.style.display = 'none'; };
        icono.src = genero.icono;

        renderInfo(genero.info);
        renderStats('stats-1', genero.stats1);
        renderStats('stats-2', genero.stats2);
        renderLeyendas(genero.leyendas);
        renderVideos(genero.leyendas);
        renderDuetos(genero.duetos);
        renderArtistas(genero.artistas);
    });
    </script>
</body>
</html>
