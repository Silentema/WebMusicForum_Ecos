name: 🚀 ecosmusica.fwh.is

on:
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions
  push:
    branches:
      - master

jobs:
  deploy:
    name: 🎉 Deploy to ecosmusica.fwh.is
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net # Change if using another host
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/ # Replace with your correct path