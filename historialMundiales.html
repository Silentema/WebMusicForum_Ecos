<!DOCTYPE html>
<html lang="es">
<head>
        <script>
        function setContrastMode(enabled) {
            if (enabled) {
                document.body.classList.add('contrast-theme');
            } else {
                document.body.classList.remove('contrast-theme');
            }
        }
        setContrastMode(localStorage.getItem('contrastMode') === 'true');
        document.getElementById('global-contrast-btn').onclick = function() {
            const enabled = !(localStorage.getItem('contrastMode') === 'true');
            localStorage.setItem('contrastMode', enabled);
            setContrastMode(enabled);
        };
        window.addEventListener('storage', function(e) {
            if (e.key === 'contrastMode') {
                setContrastMode(e.newValue === 'true');
            }
        });
        </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATCHIO - Géneros Musicales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/historialMundiales.css" />
    <link rel="stylesheet" href="CSS/back-btn.css" />
</head>
<body style="padding-top:70px;">
      <div id="header-container"></div>
    <script src="headerLoader.js"></script>

              <button class="back-btn" onclick="history.back()" style="top:90px">←</button>

        <div class="timeline-section">
            <div class="timeline-container" id="timeline-container">
                <div class="timeline-item" data-gendre="Pop" onclick="selectGendre('Pop')">
                    <a href="equipos.html"><img src="Image/mj.png" alt="Michael Jackson" class="timeline-logo small"></a>
                    <div class="timeline-year faded">Pop</div>
                </div>
                <div class="timeline-item" data-gendre="Rock" onclick="selectGendre('Rock')">
                    <a href="equipos.html"><img src="Image/kc.png" alt="Kurt Cobain" class="timeline-logo small"></a>
                    <div class="timeline-year faded">Rock</div>
                </div>
                <div class="timeline-item" data-gendre="Country" onclick="selectGendre('Country')">
                    <a href="equipos.html"><img src="Image/dp.png" alt="Dolly Parton" class="timeline-logo"></a>
                    <div class="timeline-year inactive">Country</div>
                </div>
                <div class="timeline-item" data-gendre="Rap" onclick="selectGendre('Rap')">
                    <a href="equipos.html"><img src="Image/tsh.png" alt="Tupac Shakur" class="timeline-logo large"></a>
                    <div class="timeline-year active">Rap</div>
                </div>
                <div class="timeline-item" data-gendre="Regional" onclick="selectGendre('Regional')">
                    <a href="equipos.html"><img src="Image/jg.png" alt="Juan Gabriel" class="timeline-logo"></a>
                    <div class="timeline-year inactive">Regional</div>
                </div>
                <div class="timeline-item" data-gendre="Electronica" onclick="selectGendre('Electronica')">
                    <a href="equipos.html"><img src="Image/punk.png" alt="Daft Punk" class="timeline-logo small"></a>
                    <div class="timeline-year faded">Electronica</div>
                </div>
                <div class="timeline-item" data-gendre="Reggaeton" onclick="selectGendre('Reggaeton')">
                    <a href="equipos.html"><img src="Image/kg.png" alt="Karol G" class="timeline-logo small"></a>
                    <div class="timeline-year faded">Reggaeton</div>
                </div>
            </div>

            <div class="timeline-arrows">
                <svg class="timeline-arrow" id="prev-arrow" onclick="navigateTimeline(-1)" viewBox="0 0 57 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M37.6905 11.6193V44.1531L11.7781 27.8862L37.6905 11.6193Z" fill="#1D1B20"/>
                </svg>
                <svg class="timeline-arrow" id="next-arrow" onclick="navigateTimeline(1)" viewBox="0 0 57 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.8457 44.1529V11.6191L44.7581 27.886L18.8457 44.1529Z" fill="#1D1B20"/>
                </svg>
            </div>
        </div>

        <div class="divider"></div>

    <main>
        
        <!-- Toda la información del mundial (Curiosidades, Campeones, Grupos, etc.) ha sido eliminada -->
        <!-- Aquí puedes empezar a colocar tu nueva información musical -->

    </main>

    <script>
        let currentIndex = 3; // Índice del elemento activo (Rap por defecto)
        const timelineItems = document.querySelectorAll('.timeline-item');
        const timelineContainer = document.getElementById('timeline-container');

        // Nota: Si vas a usar esta función de tu proyecto anterior, recuerda cambiar el arreglo de "years"
        // por los nombres de tus géneros ['Pop', 'Rock', 'Country', 'Rap', 'Regional', 'Electronica', 'Reggaeton']
        function selectYear(year) {
            const years = [1998, 2002, 2006, 2010, 2014, 2018, 2022];
            const newIndex = years.indexOf(year);
            if (newIndex !== -1) {
                currentIndex = newIndex;
                updateTimeline();
                centerSelectedItem();
                
                showLoadingSkeleton();
                
                setTimeout(() => {
                    restoreOriginalContent();
                }, 600);;
            }
        }

        function navigateTimeline(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < timelineItems.length) {
                currentIndex = newIndex;
                updateTimeline();
                centerSelectedItem();
                
                showLoadingSkeleton();
                
                setTimeout(() => {
                    restoreOriginalContent();
                }, 600);
            }
        }

        let originalContent = null;
        
        function showLoadingSkeleton() {
            const mainElement = document.querySelector('main');
            const contentSections = document.querySelectorAll('main h1, .info-section, .champion-section, .champion-display, .section-content, .list-container, .groups-container, main section, main .trophy-image');
            
            if (!originalContent) {
                originalContent = Array.from(contentSections).map(section => section.outerHTML);
            }
            
            if (!document.getElementById('skeleton-styles')) {
                const style = document.createElement('style');
                style.id = 'skeleton-styles';
                style.textContent = `
                    .skeleton-images {
                        display: flex;
                        gap: 20px;
                        margin-bottom: 30px;
                        justify-content: center;
                    }
                    .skeleton-img {
                        width: 20px;
                        height: 20px;
                        background: var(--hover);
                        border-radius: 50%;
                    }
                  
                `;
                document.head.appendChild(style);
            }
            
            // Crear un único contenedor skeleton que reemplace todo
            const divider = document.querySelector('.divider');
            
            const skeletonContainer = document.createElement('div');
            skeletonContainer.id = 'main-skeleton';
            skeletonContainer.innerHTML = `
                <div class="skeleton-images">
                    <div class="skeleton-img"></div>
                    <div class="skeleton-img"></div>
                    <div class="skeleton-img"></div>
                </div>
            `;
            skeletonContainer.style.cssText = `
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 200px;
                margin: 40px 0;
            `;
            
            contentSections.forEach(section => {
                section.style.display = 'none';
            });
            
            divider.parentNode.insertBefore(skeletonContainer, divider.nextSibling);
        }
        
        function restoreOriginalContent() {
            const skeletonContainer = document.getElementById('main-skeleton');
            if (skeletonContainer) {
                skeletonContainer.remove();
            }
            
            const contentSections = document.querySelectorAll('main h1, .info-section, .champion-section, .champion-display, .section-content, .list-container, .groups-container, main section, main .trophy-image');
            contentSections.forEach(section => {
                section.style.display = '';
            });
        }
        
        function updateTimeline() {
            timelineItems.forEach((item, index) => {
                const year = item.querySelector('.timeline-year');
                const logo = item.querySelector('.timeline-logo');
                
                year.classList.remove('active', 'inactive', 'faded');
                logo.classList.remove('small', 'large');
                
                const distance = Math.abs(index - currentIndex);
                
                if (index === currentIndex) {
                    year.classList.add('active');
                    logo.classList.add('large');
                } else if (distance === 1) {
                    year.classList.add('inactive');
                } else {
                    year.classList.add('faded');
                    logo.classList.add('small');
                }
            });
        }

        function centerSelectedItem() {
            const selectedItem = timelineItems[currentIndex];
            const containerWidth = timelineContainer.offsetWidth;
            const itemWidth = selectedItem.offsetWidth;
            const itemOffsetLeft = selectedItem.offsetLeft;
            
            const scrollPosition = itemOffsetLeft - (containerWidth / 2) + (itemWidth / 2);
            
            timelineContainer.scrollTo({
                left: scrollPosition,
                behavior: 'smooth'
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateTimeline();
            centerSelectedItem();
        });

        timelineContainer.addEventListener('scroll', function() {
        });
    </script>
</body>
</html>
