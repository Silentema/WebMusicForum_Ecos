    <script>
    function applyContrastFromStorage() {
      if (localStorage.getItem('contrastMode') === 'true') {
        document.body.classList.add('contrast-theme');
        var btn = document.getElementById('global-contrast-btn');
        if (btn) btn.classList.add('active');
      } else {
        document.body.classList.remove('contrast-theme');
        var btn = document.getElementById('global-contrast-btn');
        if (btn) btn.classList.remove('active');
      }
    }
    document.addEventListener('DOMContentLoaded', function() {
      applyContrastFromStorage();
      var btn = document.getElementById('global-contrast-btn');
      if (btn) {
        btn.addEventListener('click', function() {
          var isActive = document.body.classList.contains('contrast-theme');
          if (isActive) {
            localStorage.setItem('contrastMode', 'false');
          } else {
            localStorage.setItem('contrastMode', 'true');
          }
          applyContrastFromStorage();
        });
      }
      window.addEventListener('storage', function(e) {
        if (e.key === 'contrastMode') {
          applyContrastFromStorage();
        }
      });
    });
    </script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var editBtn = document.querySelector('.edit-btn');
        var coverOverlay = document.getElementById('cover-overlay');
        var avatarOverlay = document.getElementById('avatar-overlay');
        var cover = document.getElementById('cover-img');
        var avatar = document.getElementById('avatar-img');
        var coverFile = document.getElementById('cover-file');
        var avatarFile = document.getElementById('avatar-file');
        var coverWrap = document.querySelector('.cover-wrap');
        var editMode = false;
        if(editBtn && coverOverlay && avatarOverlay && cover && avatar && coverWrap) {
          // Asegura overlays en la misma posición y tamaño
          coverWrap.style.position = 'relative';
          coverOverlay.style.position = 'absolute';
          coverOverlay.style.top = '0';
          coverOverlay.style.left = '0';
          coverOverlay.style.width = cover.offsetWidth + 'px';
          coverOverlay.style.height = cover.offsetHeight + 'px';
          avatarOverlay.style.position = 'absolute';
          avatarOverlay.style.left = avatar.style.left || '38px';
          avatarOverlay.style.bottom = avatar.style.bottom || '-58px';
          avatarOverlay.style.width = avatar.offsetWidth + 'px';
          avatarOverlay.style.height = avatar.offsetHeight + 'px';
          var bioInput = document.getElementById('bio-input');
          editBtn.addEventListener('click', function() {
            editMode = !editMode;
            coverOverlay.style.display = editMode ? 'flex' : 'none';
            avatarOverlay.style.display = editMode ? 'flex' : 'none';
            if (editMode) {
              bioInput.removeAttribute('readonly');
              bioInput.style.background = 'rgba(0,0,0,0.08)';
            } else {
              bioInput.setAttribute('readonly', true);
              bioInput.style.background = 'none';
            }
          });
          // Cambiar imagen de perfil y banner al hacer clic en el overlay
          coverOverlay.addEventListener('click', function() {
            if (editMode) coverFile.click();
          });
          avatarOverlay.addEventListener('click', function() {
            if (editMode) avatarFile.click();
          });
          coverFile.addEventListener('change', function(e) {
            if (coverFile.files && coverFile.files[0]) {
              var reader = new FileReader();
              reader.onload = function(ev) {
                cover.src = ev.target.result;
              };
              reader.readAsDataURL(coverFile.files[0]);
            }
          });
          avatarFile.addEventListener('change', function(e) {
            if (avatarFile.files && avatarFile.files[0]) {
              var reader = new FileReader();
              reader.onload = function(ev) {
                avatar.src = ev.target.result;
              };
              reader.readAsDataURL(avatarFile.files[0]);
            }
          });
          // Ajustar overlays si cambia el tamaño de la ventana
          window.addEventListener('resize', function() {
            coverOverlay.style.width = cover.offsetWidth + 'px';
            coverOverlay.style.height = cover.offsetHeight + 'px';
            avatarOverlay.style.width = avatar.offsetWidth + 'px';
            avatarOverlay.style.height = avatar.offsetHeight + 'px';
          });
        }
      });
    </script>

    <script>
        const perfilPostTemplate = `

                        </button>
                        <button class="comment-button">
                            <span class="post-stat-number">{{comments}}</span>
                            <svg class="comment-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20 20L16 16H2C1.45 16 0.979167 15.8042 0.5875 15.4125C0.195833 15.0208 0 14.55 0 14V2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0H18C18.55 0 19.0208 0.195833 19.4125 0.5875C19.8042 0.979167 20 1.45 20 2V20ZM2 14H16.85L18 15.125V2H2V14Z" fill="#777777"/>

        function expandirPerfilPosts() {
            const posts = document.querySelectorAll('perfil-post');
            posts.forEach(post => {
                const avatar = post.getAttribute('avatar') || 'Image/mujerGris.jpg';
                const username = post.getAttribute('username') || 'Usuario';
                const title = post.getAttribute('title') || 'Título del post';
                const image = post.getAttribute('image') || 'Image/default.jpg';
                const imageAlt = post.getAttribute('image-alt') || 'Imagen';
                const tags = post.getAttribute('tags') ? 
                    post.getAttribute('tags').split(',').map(tag => `<span class="post-tag">#${tag.trim()}</span>`).join('') : '';
                const date = post.getAttribute('date') || 'Fecha';
                const likes = post.getAttribute('likes') || '0';
                const comments = post.getAttribute('comments') || '0';

                let html = perfilPostTemplate
                    .replace(/\{\{avatar\}\}/g, avatar)
                    .replace(/\{\{username\}\}/g, username)
                    .replace(/\{\{title\}\}/g, title)
                    .replace(/\{\{image\}\}/g, image)
                    .replace(/\{\{imageAlt\}\}/g, imageAlt)
                    .replace(/\{\{tags\}\}/g, tags)
                    .replace(/\{\{date\}\}/g, date)
                    .replace(/\{\{likes\}\}/g, likes)
                    .replace(/\{\{comments\}\}/g, comments);

                post.outerHTML = html;
            });
        }

        document.addEventListener('DOMContentLoaded', expandirPerfilPosts);

        function toggleLike(button) {
            const heartIcon = button.querySelector('.heart-icon path');
            const likeNumber = button.querySelector('.post-stat-number');
            let currentLikes = parseInt(likeNumber.textContent.replace('k', '')) * (likeNumber.textContent.includes('k') ? 1000 : 1);
            
            if (heartIcon.getAttribute('fill') === '#777777') {
                heartIcon.setAttribute('fill', '#ff3040');
                button.classList.add('liked');
                currentLikes++;
            } else {
                heartIcon.setAttribute('fill', '#777777');
                button.classList.remove('liked');
                currentLikes--;
            }
            
           if (numericLikes >= 1000) {
                displayLikes = (numericLikes / 1000).toFixed(1).replace('.0', '') + 'k';
            } else if (numericLikes >= 999 && currentLikes.includes('k')) {
                displayLikes = '1k';
            } else {
                displayLikes = numericLikes.toString();
            }
        }
    </script>
