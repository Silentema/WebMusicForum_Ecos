<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <div class="menu-container">

    <aside class="menu-sidebar">
      <button class="menu-close-menu">&times;</button>
      <h2 class="menu-title">Menú</h2>


      <nav class="menu-nav">


        <button class="menu-item" onclick="location.href='historialMundiales.html'">
          <div class="menu-icon">
            <img src="Image/historialMundiales.png" alt="Music Gendre Data">
          </div>
          <span class="label">Music Gendre Data</span>
        </button>

        <button class="menu-item" onclick="location.href='ajustes.php'">
          <div class="menu-icon">
            <img src="Image/ajustesLogo.png" alt="Ajustes">
          </div>
          <span class="label">Ajustes</span>
        </button>


        <button class="menu-item admin-only" onclick="location.href='aceptarPublicacionesAdmin.html'">
          <div class="menu-icon">
            <img src="Image/controlAdmin.png" alt="Control de publicaciones">
          </div>
          <span class="label">Control de publicaciones</span>
        </button>

        <button class="menu-item admin-only" onclick="location.href='modificarHistorialMundialesAdmin.html'">
          <div class="menu-icon">

        <button class="menu-item admin-only" onclick="location.href='adminControlDeCategorias.html'">

    <!-- MAIN -->
    <main class="menu-main">
      <div class="menu-content">


      </div>
    </main>

  </div>
</body>
<script>
 document.addEventListener('DOMContentLoaded', function() {
  var rol = localStorage.getItem('rol');
  var adminItems = document.querySelectorAll('.admin-only');

  if (rol && rol.toLowerCase() === 'admin') {
    adminItems.forEach(item => item.classList.add('show'));
  } else {
    adminItems.forEach(item => item.classList.remove('show'));
  }
});

  window.addEventListener('storage', function(e) {
    if (e.key === 'rol') {
      window.location.reload();
    }
  });
</script>
</html>
