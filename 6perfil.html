    <style>
    body.contrast-theme .name {

    }
    body.contrast-theme .bio {

    .sr-only {
      position: absolute;
      width: 1px;

      padding: 0;
      margin: -1px;

      clip: rect(0, 0, 0, 0);

    body.contrast-theme .edit-btn {

    /* Animación suave para los tres botones superiores */
    .notif-btn, .follow-btn, #blockBtn {
      transition: background 0.3s, color 0.3s, border 0.3s, box-shadow 0.3s, transform 0.2s;
    }
    .notif-btn:active, .follow-btn:active, #blockBtn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }
    </style>
    <script>
    function applyContrastFromStorage() {
      if (localStorage.getItem('contrastMode') === 'true') {
        document.body.classList.add('contrast-theme');
        var btn = document.getElementById('global-contrast-btn');
        if (btn) btn.classList.add('active');
      } else {
        document.body.classList.remove('contrast-theme');
        var btn = document.getElementById('global-contrast-btn');
        if (btn) btn.classList.remove('active');
      }
    }
    document.addEventListener('DOMContentLoaded', function() {
      applyContrastFromStorage();
      var btn = document.getElementById('global-contrast-btn');
      if (btn) {
        btn.addEventListener('click', function() {
          var isActive = document.body.classList.contains('contrast-theme');
          if (isActive) {
            localStorage.setItem('contrastMode', 'false');
          } else {
            localStorage.setItem('contrastMode', 'true');
          }
          applyContrastFromStorage();
        });
      }
      window.addEventListener('storage', function(e) {
        if (e.key === 'contrastMode') {
          applyContrastFromStorage();
        }
      });
    });
    </script>
    <script>
        const perfilPostTemplate = `
            <article class="post">
                <div class="post-head">
                    <a href="6perfil.html" class="post-avatar">

                    </a>
                    <a href="6perfil.html" class="post-username" style="padding-left: 15px;">

                    </a>
                </div>
                <h2 class="post-title">{{title}}</h2>
                <a href="5verPost.html">
                    <img class="post-img" src="{{image}}" alt="{{imageAlt}}" />
                </a>
                <div class="post-footer" style="margin: 15px;">

                    </a>
                    <span class="post-date">{{date}}</span>
                    <div class="post-stats">
                        <button class="like-button" onclick="toggleLike(this)">
                            <span class="post-stat-number">{{likes}}</span>
                            <svg class="heart-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M10 20L8.55 18.5831C6.86667 16.9301 5.475 15.5041 4.375 14.3052C3.275 13.1063 2.4 12.03 1.75 11.0763C1.1 10.1226 0.645833 9.24614 0.3875 8.44687C0.129167 7.64759 0 6.83015 0 5.99455C0 4.28701 0.525 2.86104 1.575 1.71662C2.625 0.572207 3.93333 0 5.5 0C6.36667 0 7.19167 0.199818 7.975 0.599455C8.75833 0.999092 9.43333 1.56222 10 2.28883C10.5667 1.56222 11.2417 0.999092 12.025 0.599455C12.8083 0.199818 13.6333 0 14.5 0C16.0667 0 17.375 0.572207 18.425 1.71662C19.475 2.86104 20 4.28701 20 5.99455C20 6.83015 19.8708 7.64759 19.6125 8.44687C19.3542 9.24614 18.9 10.1226 18.25 11.0763C17.6 12.03 16.725 13.1063 15.625 14.3052C14.525 15.5041 13.1333 16.9301 11.45 18.5831L10 20Z" fill="#777777"/>
                            </svg>
                        </button>
                        <button class="comment-button">
                            <span class="post-stat-number">{{comments}}</span>
                            <svg class="comment-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20 20L16 16H2C1.45 16 0.979167 15.8042 0.5875 15.4125C0.195833 15.0208 0 14.55 0 14V2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0H18C18.55 0 19.0208 0.195833 19.4125 0.5875C19.8042 0.979167 20 1.45 20 2V20ZM2 14H16.85L18 15.125V2H2V14Z" fill="#777777"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </article>
            <div class="tabs-divider" style="width:auto ;padding-bottom: 20px;"></div>
        `;

        function expandirPerfilPosts() {
            const posts = document.querySelectorAll('perfil-post');
            posts.forEach(post => {
                const avatar = post.getAttribute('avatar') || 'Image/mujerGris.jpg';
                const username = post.getAttribute('username') || 'Usuario';
                const title = post.getAttribute('title') || 'Título del post';
                const image = post.getAttribute('image') || 'Image/default.jpg';
                const imageAlt = post.getAttribute('image-alt') || 'Imagen';
                const tags = post.getAttribute('tags') ? 
                    post.getAttribute('tags').split(',').map(tag => `<span class="post-tag">#${tag.trim()}</span>`).join('') : '';
                const date = post.getAttribute('date') || 'Fecha';
                const likes = post.getAttribute('likes') || '0';
                const comments = post.getAttribute('comments') || '0';

                let html = perfilPostTemplate
                    .replace(/\{\{avatar\}\}/g, avatar)
                    .replace(/\{\{username\}\}/g, username)
                    .replace(/\{\{title\}\}/g, title)
                    .replace(/\{\{image\}\}/g, image)
                    .replace(/\{\{imageAlt\}\}/g, imageAlt)
                    .replace(/\{\{tags\}\}/g, tags)
                    .replace(/\{\{date\}\}/g, date)
                    .replace(/\{\{likes\}\}/g, likes)
                    .replace(/\{\{comments\}\}/g, comments);

                post.outerHTML = html;
            });
        }

        document.addEventListener('DOMContentLoaded', expandirPerfilPosts);

        function toggleLike(button) {
            const heartIcon = button.querySelector('.heart-icon path');
            const likeNumber = button.querySelector('.post-stat-number');
            let currentLikes = parseInt(likeNumber.textContent.replace('k', '')) * (likeNumber.textContent.includes('k') ? 1000 : 1);

            if (heartIcon.getAttribute('fill') === '#777777') {
                heartIcon.setAttribute('fill', '#ff3040');
                button.classList.add('liked');
                currentLikes++;
            } else {
                heartIcon.setAttribute('fill', '#777777');
                button.classList.remove('liked');
                currentLikes--;
            }

           if (currentLikes >= 1000) {
                displayLikes = (currentLikes / 1000).toFixed(1).replace('.0', '') + 'k';
            } else if (currentLikes >= 999 && likeNumber.textContent.includes('k')) {
                displayLikes = '1k';
            } else {
                displayLikes = currentLikes.toString();
            }
            likeNumber.textContent = displayLikes;
        }


        function toggleFollow(btn) {
          btn.classList.toggle('selected');
          if (btn.classList.contains('selected')) {
            btn.textContent = 'Siguiendo';
          } else {
            btn.textContent = 'Seguir';
          }
        }

        function toggleNotification(btn) {
          btn.classList.toggle('active');
        }

                  function toggleBlock(btn) {
            btn.classList.toggle('active');
          }

        function toggleNotification(svg) {
            const path = svg.querySelector('path');
            if (path.getAttribute('fill') === '#FF5050') {
                path.setAttribute('fill', '#000000');
            } else {
                path.setAttribute('fill', '#FF5050');
            }
        }
    </script>
