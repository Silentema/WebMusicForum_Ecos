<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Publicación • ECOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/publicaciones.css">
    <style>
        :root {
            --bg: #F5F5F5;
            --text: #222;
            --sub: #777;
            --line: #999;
            --header: #121212;
            --btn: #D24242;
            --white: #fff;
            --card-bg: #ffffff;
            --container-bg: #e6e6e6;
            --input-bg: #f9f9f9;
            --border: #6b6969;
            --hover: #ddd;
            --icon-color: #D24242;
            --close-icon: #79747E;
        }

        body.dark-theme {
            --bg: #1a1a1a;
            --text: #e0e0e0;
            --sub: #aaa;
            --line: #444;
            --header: #000;
            --btn: #ff6b6b;
            --white: #2d2d2d;
            --card-bg: #2d2d2d;
            --container-bg: #2d2d2d;
            --input-bg: #333;
            --border: #444;
            --hover: #333333;
            --icon-color: #ff6b6b;
            --close-icon: #aaa;
        }

        body {
            background-color: var(--bg);
            font-family: 'Montserrat', -apple-system, Roboto, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container-overlay {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border-radius: 43px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 16px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .user-avatar {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--btn);
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-name {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        .close-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .title-input {
            width: 100%;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding-bottom: 8px;
            box-sizing: border-box;
        }

        body.dark-theme .title-input {
            border-bottom-color: rgba(255,255,255,0.1);
        }

        .image-container {
            width: 100%;
            margin-bottom: 18px;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            background: rgba(0,0,0,0.04);
            display: none;
        }

        .image-container.active {
            display: block;
        }

        .image-container img {
            width: 100%;
            max-height: 380px;
            display: block;
            object-fit: cover;
        }

        .remove-img-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .description-textarea {
            width: 100%;
            min-height: 90px;
            font-size: 16px;
            color: var(--text);
            background: transparent;
            border: none;
            outline: none;
            resize: vertical;
            font-family: inherit;
            line-height: 1.6;
            margin-bottom: 24px;
            padding: 0;
            box-sizing: border-box;
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(0,0,0,0.08);
            padding-top: 16px;
            gap: 16px;
        }

        body.dark-theme .footer {
            border-top-color: rgba(255,255,255,0.1);
        }

        .icon-group {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .icon-btn {
            background: rgba(0,0,0,0.05);
            border: none;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: all 0.2s;
        }

        body.dark-theme .icon-btn {
            background: rgba(255,255,255,0.08);
        }

        .icon-btn:hover {
            background: var(--btn);
            transform: translateY(-2px);
        }

        .icon-btn:hover img {
            filter: brightness(0) invert(1);
        }

        .publish-btn {
            background-color: var(--btn);
            color: white;
            border: none;
            border-radius: 67px;
            padding: 10px 28px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .publish-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body> 
    <div class="container-overlay">
        <div class="header">
            <div class="user-info">
                <div class="user-avatar">
                    <img src="avatar_actual.php" alt="Eric Lopez Parra">
                </div>
                <div class="user-name" id="user-name-display">Mi Publicación</div>
            </div>
            <button class="close-btn" aria-label="Close" onclick="window.history.back()">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <input type="text" id="title-field" class="title-input" placeholder="Título de la publicación...">

        <div class="image-container" id="post-img-container">
            <img id="preview-img-tag" src="" alt="Imagen">
            <button type="button" class="remove-img-btn" onclick="quitarImagen()" title="Quitar imagen">&times;</button>
        </div>

        <textarea id="desc-field" class="description-textarea" placeholder="¿Qué estás escuchando o pensando hoy?"></textarea>

        <input type="file" id="file-uploader" accept="image/*" style="display:none;" onchange="procesarArchivo(this)">

        <div class="footer">
            <div class="icon-group">
                <button type="button" class="icon-btn" onclick="document.getElementById('file-uploader').click()" title="Subir imagen desde mi computadora">
                   <img src="Image/imagen.png" alt="Agregar imagen" style="width: 24px; height: 24px;">
                </button>
                <button type="button" class="icon-btn" onclick="openEmojiPicker(event, 'desc-field')" title="Seleccionar emojis">
                    <img src="Image/emoji.png" alt="Agregar emoji" style="width: 24px; height: 24px;">
                </button>
            </div>
            <button type="button" class="publish-btn" id="btn-submit-post" onclick="enviarNuevaPublicacion()">Publicar</button>
        </div>
    </div>

    <script src="publicaciones.js"></script>
    <script>
        function procesarArchivo(input) {
            const container = document.getElementById('post-img-container');
            const img = document.getElementById('preview-img-tag');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    img.src = e.target.result;
                    container.classList.add('active');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function quitarImagen() {
            document.getElementById('file-uploader').value = '';
            document.getElementById('preview-img-tag').src = '';
            document.getElementById('post-img-container').classList.remove('active');
        }

        async function enviarNuevaPublicacion() {
            const titulo = document.getElementById('title-field').value.trim();
            const texto = document.getElementById('desc-field').value.trim();
            const fileInput = document.getElementById('file-uploader');
            const btn = document.getElementById('btn-submit-post');

            const tieneImagen = fileInput.files && fileInput.files.length > 0;

            if (!titulo && !texto && !tieneImagen) {
                alert('Escribe un título, descripción o selecciona una imagen.');
                return;
            }

            const formData = new FormData();
            formData.append('titulo', titulo);
            formData.append('texto', texto);
            if (tieneImagen) {
                formData.append('imagen', fileInput.files[0]);
            }

            try {
                btn.disabled = true;
                btn.textContent = 'Publicando...';

                const resp = await fetch('api_publicaciones.php?accion=crear_publicacion', {
                    method: 'POST',
                    body: formData
                });
                const data = await resp.json();

                if (!data.success) {
                    throw new Error(data.error || 'Error al publicar.');
                }

                alert('¡Publicación creada exitosamente!');
                window.location.href = '6perfilPropio.php';
            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btn.textContent = 'Publicar';
            }
        }
    </script>
</body>
</html>
